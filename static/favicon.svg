  <text x="32" y="36" font-family="Arial,Helvetica,sans-serif" font-size="11"
        font-weight="bold" fill="#0e639c" text-anchor="middle">EN</text>
  <text x="32" y="47" font-family="Arial,Helvetica,sans-serif" font-size="11"
        font-weight="bold" fill="#0e639c" text-anchor="middle">DA</text>
</svg>
