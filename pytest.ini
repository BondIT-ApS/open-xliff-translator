[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
# Explicit since pytest-asyncio 1.5 warns when unset. No async fixture here
# asks for a wider scope, so per-test loops change nothing.
asyncio_default_fixture_loop_scope = function

addopts =
    --cov=app
    --cov=history
    --cov=cleanup
    --cov=db
    --cov=glossary
    --cov=middleware
    --cov=settings
    --cov=translation
    --cov=validation
    --cov-report=html
    --cov-report=xml
    --cov-report=term-missing
    --cov-fail-under=85
    -v

[coverage:run]
source = .
omit =
    tests/*
    test_*.py
    */__pycache__/*
    */venv/*
