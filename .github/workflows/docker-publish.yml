name: 🚀 LEGO Production Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly security scan - Sundays at 22:40 UTC
    - cron: '40 22 * * 0'

permissions:
  contents: write        # push the YY.M.PATCH release tag
  packages: write
  security-events: write

jobs:
  # 🔍 LEGO Changed Brick Discovery
  detect-changes:
    name: 🔍 LEGO Changed Brick Discovery
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      any-service: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - name: 📎 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2  # Need at least 2 commits to compare

      - name: 🔍 Detect Changed LEGO Bricks
        id: filter
        run: |
          # Get changed files from last commit (main branch push)
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "FORCE_ALL")
          echo "Changed files: $CHANGED_FILES"

          # Fallback: if no previous commit or error, build everything
          if [ "$CHANGED_FILES" = "FORCE_ALL" ]; then
            echo "⚠️  Unable to detect changes (first commit or error), building all services"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check if backend changed (Python files, requirements, etc.)
          if echo "$CHANGED_FILES" | grep -E '^(app\.py|requirements\.txt|Dockerfile|templates/|static/|config/)' > /dev/null; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "🧱 Backend changes detected"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  No backend changes"
          fi

          # For now, assume frontend changes with any non-backend file changes
          # (This can be refined once we identify frontend-specific files)
          if echo "$CHANGED_FILES" | grep -E '^(frontend/|static/|templates/)' > /dev/null; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "🧱 Frontend changes detected"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "⏭️  No frontend changes"
          fi

  # 🧪 Run Tests and Validation (Before Build)
  test-and-validation:
    name: 🧪 LEGO Quality Assurance
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'

    steps:
      - name: 📎 Checkout code
        uses: actions/checkout@v6

      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pytest pytest-cov safety bandit

      - name: 🔍 Run Pylint
        run: |
          pylint app.py db.py glossary.py settings.py translation.py --rcfile=.pylintrc || true

      - name: 🧪 Run tests with coverage
        run: |
          # Coverage scope and reports come from pytest.ini so they stay in one
          # place; passing --cov=app here would pin CI to a single module.
          pytest

      - name: 📊 Upload coverage to CodeCov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-production
          fail_ci_if_error: false
          verbose: true

      - name: 🛡️ Security check with bandit
        run: |
          bandit -r . -f json -o bandit-report.json -x tests/ || true

      - name: 🛡️ Dependency security scan with Safety CLI
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: |
          {
            echo "### 🛡️ Safety CLI Dependency Scan (Production)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Run safety scan and capture output
          safety scan --output json > safety-report.json 2>&1 || true
          safety scan --output text > safety-report.txt 2>&1 || true

          # Add summary to GitHub Actions
          if [ -f safety-report.txt ]; then
            {
              echo "\`\`\`"
              head -n 50 safety-report.txt
              echo "\`\`\`"
              echo ""
              echo "📊 Full report uploaded to [Safety Platform](https://platform.safetycli.com/codebases/open-xliff-translator/findings)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 📤 Upload Safety scan artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: safety-scan-results-production-${{ github.sha }}
          path: |
            safety-report.json
            safety-report.txt
          retention-days: 90

  # 🏢 Production LEGO Assembly Line
  production-build:
    name: 🏢 Build Production LEGO Set
    runs-on: ubuntu-latest
    needs: [detect-changes, test-and-validation]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      needs.detect-changes.outputs.backend == 'true'

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: 📎 Get LEGO Instructions (Checkout)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history + tags: the patch counter is derived from tags

      - name: 🌍 Set up Multi-Platform Builder (QEMU)
        uses: docker/setup-qemu-action@v4

      - name: 🔧 Prepare Assembly Line (Docker Buildx)
        uses: docker/setup-buildx-action@v4
        id: buildx

      - name: 🔑 Connect to LEGO Warehouse (Docker Hub)
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏷️ Generate Semantic Version Tag
        id: version
        run: |
          # YY.M.PATCH, matching every other BondIT repo. The patch counter is
          # derived from the git tags for the current month and RESETS to .0 on
          # the first build of a new month.
          #
          # It previously used github.run_number, a monotonic all-time counter
          # that never reset -- so August 2026 published 26.8.82 through
          # 26.8.98 for just 13 builds, reading as though there had been 98
          # releases that month.
          chmod +x scripts/increment-version.sh
          ./scripts/increment-version.sh

          VERSION=$(grep "^NEW_VERSION=" "$GITHUB_OUTPUT" | cut -d'=' -f2 | tail -1)
          YEAR_MONTH_TAG=$(echo "$VERSION" | cut -d'.' -f1-2)

          echo "version=${VERSION}" >> "$GITHUB_ENV"
          echo "year_month=${YEAR_MONTH_TAG}" >> "$GITHUB_ENV"

          echo "🏷️ Building semantic version: ${VERSION}"
          echo "📅 Year/Month tag: ${YEAR_MONTH_TAG}"

      - name: 🏢 Build & Push Semantic Versioned LEGO Set with Attestations
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            maboni82/open-xliff-translator:latest
            maboni82/open-xliff-translator:${{ env.version }}
            maboni82/open-xliff-translator:${{ env.year_month }}
          builder: ${{ steps.buildx.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: 🏷️ Push Release Tag
        run: |
          # The tag is what makes the monthly reset work: the next build reads
          # it back to compute the following patch. Without it the counter has
          # no memory and every build would restart at .0.
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "${{ env.version }}" -m "Release ${{ env.version }}

          Commit: ${GITHUB_SHA:0:8}
          Build:  GitHub Actions #${GITHUB_RUN_NUMBER}
          "
          git push origin "${{ env.version }}"
          echo "✅ Tagged ${{ env.version }}"

      - name: 🛡️ Container image scan with Trivy
        # Report findings without blocking the release (same spirit as `|| true` on the other security steps)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: maboni82/open-xliff-translator:${{ env.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

      - name: 📤 Upload Trivy results to GitHub Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container-image

  # 🛡️ Weekly Security Monitoring (scheduled only)
  weekly-security-scan:
    name: 🛡️ Weekly LEGO Security Fortress Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    
    steps:
      - name: 📎 Get LEGO Security Instructions
        uses: actions/checkout@v6
      
      - name: 🔧 Initialize Deep Security Scanner
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      
      - name: 🔍 Perform Weekly Security Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
      
      - name: 📆 Security Scan Complete
        run: |
          echo "🛡️ Weekly security analysis completed for ${{ matrix.language }}"
          echo "Results are available in the GitHub Security tab"
