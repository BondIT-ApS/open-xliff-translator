# ============================================================================
# 🛡️ Weekly Security Report
# ============================================================================
# Single weekly digest covering BOTH vulnerabilities AND outdated dependencies.
#
# DESIGN INTENT
# -------------
# A developer should be able to open ONE issue per Monday and know everything
# that needs attention this week — no need to babysit per-PR Dependabot noise.
#
#   • Python: pip-audit (OSV/GHSA) always, plus Safety CLI when
#             SAFETY_API_KEY is configured. Two databases, because one alone
#             missed a HIGH advisory for a month.
#   • Node:   npm audit (no API key needed).
#   • Outdated: pip list --outdated + npm outdated, surfaced inline.
#   • Issue opens whenever vulns > 0 OR outdated > 0 (the whole point).
#   • Updates the existing weekly issue in place — no inbox flood.
#   • Auto-closes the previous week's issue when the new scan is fully clean.
#   • Assigns @MaBoNi, labels security/automated/maintenance, sets Type: Task.
#
# REQUIREMENTS
# ------------
# Repo or org-level secret SAFETY_API_KEY (optional — pip-audit runs regardless).
# Labels `security`, `automated`, `maintenance` must exist on the repo BEFORE
# the first run (workflow soft-fails on labels but the issue won't get them).
# ============================================================================

name: 🛡️ Weekly Security Report

on:
  schedule:
    # Mondays 09:00 UTC = 10:00 CET / 11:00 CEST
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    name: 🔍 Vulnerability & freshness scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ── Detect Python projects ──────────────────────────────────────────
      - name: Detect Python project
        id: detect-py
        run: |
          if find . -maxdepth 3 \( -name "requirements*.txt" -o -name "pyproject.toml" \) \
               -not -path "./node_modules/*" -not -path "./.venv/*" -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.detect-py.outputs.present == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python audit tooling
        if: steps.detect-py.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install safety pip-audit

      # ── Python vulnerability scan (Safety AND pip-audit) ─────────────────
      # Both scanners always run when Safety is configured. They draw on
      # different advisory databases, and in Nov 2026 Safety reported 0
      # vulnerabilities for a month while filelock 3.32.7 carried 13 OSV/GHSA
      # advisories (one HIGH) that pip-audit caught. A single "0" from one
      # database is not a clean bill of health.
      - name: Python vulnerability scan
        if: steps.detect-py.outputs.present == 'true'
        id: py-vulns
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: |
          mkdir -p .audit

          if [ -n "$SAFETY_API_KEY" ]; then
            echo "scanner=safety + pip-audit" >> "$GITHUB_OUTPUT"
          else
            echo "SAFETY_API_KEY not set — running pip-audit only"
            echo "scanner=pip-audit" >> "$GITHUB_OUTPUT"
          fi

          reqs=()
          while IFS= read -r req; do
            reqs+=("$req")
          done < <(find . -maxdepth 3 -name "requirements*.txt" -not -path "./node_modules/*" -not -path "./.venv/*" | sort)
          pyprojects=()
          while IFS= read -r pyp; do
            pyprojects+=("$(dirname "$pyp")")
          done < <(find . -maxdepth 3 -name "pyproject.toml" -not -path "./node_modules/*" -not -path "./.venv/*" | sort)

          # pip-audit: per requirements file. It resolves the full tree in a
          # throwaway venv, so transitive packages (which Dependabot cannot
          # see) are audited too.
          pa_total=0
          for p in "${reqs[@]}" "${pyprojects[@]}"; do
            slug=$(echo "$p" | tr '/.' '__')
            out=".audit/pipaudit_${slug}.json"
            echo "${p#./}" > ".audit/pipaudit_${slug}.label"
            echo "::group::pip-audit $p"
            if [ -f "$p" ]; then
              pip-audit --requirement "$p" --format json --output "$out" || true
            else
              pip-audit --format json --output "$out" "$p" || true
            fi
            n=$(jq '[(.dependencies // [])[]? | (.vulns // [])[]?] | length' "$out" 2>/dev/null)
            n="${n:-0}"
            echo "  $p: $n vulns"
            pa_total=$((pa_total + n))
            echo "::endgroup::"
          done
          echo "pip_audit_count=$pa_total" >> "$GITHUB_OUTPUT"

          # Safety: per directory, not per file — it scans a whole directory,
          # so two requirements files side by side would otherwise be scanned
          # (and counted) twice.
          sa_total=0
          if [ -n "$SAFETY_API_KEY" ]; then
            mapfile -t targets < <(
              for p in "${reqs[@]}"; do dirname "$p"; done
              printf '%s\n' "${pyprojects[@]}"
            )
            mapfile -t targets < <(printf '%s\n' "${targets[@]}" | grep . | sort -u)
            repo_name="${GITHUB_REPOSITORY##*/}"
            for target in "${targets[@]}"; do
              slug=$(echo "$target" | tr '/.' '__')
              out=".audit/safety_${slug}.json"
              echo "::group::safety $target"
              # Tell Safety this is the *repo* — without this it derives the
              # project name from the target directory, which makes scans of
              # backend/, api/, etc. report as those generic folder names on
              # the Safety platform instead of the actual repo.
              printf '[project]\nid = %s\nname = %s\n' "$repo_name" "$repo_name" > "$target/.safety-project.ini"
              safety scan --target "$target" --output json > "$out" 2>/dev/null || true
              rm -f "$target/.safety-project.ini"
              n=$(jq '[(.scan_results.projects // [])[]?.files[]?.results.dependencies[]?.vulnerabilities[]?] | length' "$out" 2>/dev/null)
              n="${n:-0}"
              echo "  $target: $n vulns"
              sa_total=$((sa_total + n))
              echo "::endgroup::"
            done
          fi
          echo "safety_count=$sa_total" >> "$GITHUB_OUTPUT"

          # The scanners overlap but use different advisory IDs, so summing
          # would double-count. Report the larger: whichever saw more.
          total=$(( pa_total > sa_total ? pa_total : sa_total ))
          echo "vuln_count=$total" >> "$GITHUB_OUTPUT"

      # ── Python outdated check ───────────────────────────────────────────
      - name: Python outdated packages
        if: steps.detect-py.outputs.present == 'true'
        id: py-outdated
        run: |
          mkdir -p .audit
          : > .audit/py_outdated.json
          total=0
          while IFS= read -r req; do
            slug=$(echo "$req" | tr '/.' '__')
            venv="/tmp/venv_${slug}"
            python -m venv "$venv" >/dev/null 2>&1
            # shellcheck disable=SC1090
            source "$venv/bin/activate"
            pip install --quiet --upgrade pip >/dev/null 2>&1
            pip install --quiet -r "$req" >/dev/null 2>&1 || true
            out=$(pip list --outdated --format json 2>/dev/null || echo "[]")
            echo "$out" > ".audit/py_outdated_${slug}.json"
            echo "${req#./}" > ".audit/py_outdated_${slug}.label"
            n=$(echo "$out" | jq 'length' 2>/dev/null)
            n="${n:-0}"
            echo "  $req: $n outdated"
            total=$((total + n))
            deactivate
          done < <(find . -maxdepth 3 -name "requirements*.txt" -not -path "./node_modules/*" -not -path "./.venv/*")
          echo "outdated_count=$total" >> "$GITHUB_OUTPUT"

      # ── Node detect ─────────────────────────────────────────────────────
      - name: Detect Node project(s)
        id: detect-node
        run: |
          mapfile -t pkgs < <(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*")
          if [ "${#pkgs[@]}" -gt 0 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${pkgs[@]}" > .npm-projects.txt
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.detect-node.outputs.present == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      # ── Node vulnerability + outdated scan ──────────────────────────────
      - name: Node audit & outdated
        if: steps.detect-node.outputs.present == 'true'
        id: node
        run: |
          mkdir -p .audit
          vulns_total=0
          outdated_total=0
          while IFS= read -r pkg; do
            dir=$(dirname "$pkg")
            slug=$(echo "$dir" | tr '/.' '__')
            echo "::group::npm install + audit + outdated ($dir)"
            (cd "$dir" && npm install --ignore-scripts --no-audit --no-fund --silent) || true

            audit_out=$( (cd "$dir" && npm audit --omit=dev --audit-level=low --json) 2>/dev/null || true )
            echo "$audit_out" > ".audit/node_audit_${slug}.json"
            if [ -n "$audit_out" ]; then
              n=$(echo "$audit_out" | jq '(.metadata.vulnerabilities // {}) | [.info, .low, .moderate, .high, .critical] | map(. // 0) | add' 2>/dev/null)
            fi
            n="${n:-0}"
            echo "  $dir vulns: $n"
            vulns_total=$((vulns_total + n))

            outdated_out=$( (cd "$dir" && npm outdated --json) 2>/dev/null || true )
            echo "$outdated_out" > ".audit/node_outdated_${slug}.json"
            if [ -n "$outdated_out" ]; then
              m=$(echo "$outdated_out" | jq 'length' 2>/dev/null)
            fi
            m="${m:-0}"
            echo "  $dir outdated: $m"
            outdated_total=$((outdated_total + m))
            echo "::endgroup::"
          done < .npm-projects.txt
          echo "vuln_count=$vulns_total" >> "$GITHUB_OUTPUT"
          echo "outdated_count=$outdated_total" >> "$GITHUB_OUTPUT"

      # ── Aggregate totals ────────────────────────────────────────────────
      - name: Compute totals
        id: totals
        run: |
          py_v="${{ steps.py-vulns.outputs.vuln_count || 0 }}"
          py_o="${{ steps.py-outdated.outputs.outdated_count || 0 }}"
          n_v="${{ steps.node.outputs.vuln_count || 0 }}"
          n_o="${{ steps.node.outputs.outdated_count || 0 }}"
          scanner="${{ steps.py-vulns.outputs.scanner || 'n/a' }}"
          py_pa="${{ steps.py-vulns.outputs.pip_audit_count || 0 }}"
          py_sa="${{ steps.py-vulns.outputs.safety_count || 0 }}"
          vulns=$((py_v + n_v))
          outdated=$((py_o + n_o))
          {
            echo "py_vulns=$py_v"
            echo "py_outdated=$py_o"
            echo "node_vulns=$n_v"
            echo "node_outdated=$n_o"
            echo "py_scanner=$scanner"
            echo "py_pip_audit=$py_pa"
            echo "py_safety=$py_sa"
            echo "vulns=$vulns"
            echo "outdated=$outdated"
          } >> "$GITHUB_OUTPUT"
          echo "📊 Vulnerabilities: $vulns (py=$py_v, node=$n_v)"
          echo "📊 Outdated:        $outdated (py=$py_o, node=$n_o)"

      # ── Build report body when there's anything to report ───────────────
      # Written to a file, never to $GITHUB_OUTPUT → env. A step output passed
      # as an env var is a single execve string, which Linux caps at 128 KB
      # (MAX_ARG_STRLEN): pip-audit's raw JSON for 13 filelock advisories was
      # ~250 KB and the issue step died with "Argument list too long".
      - name: Build report body
        if: steps.totals.outputs.vulns != '0' || steps.totals.outputs.outdated != '0'
        id: body
        run: |
          {
            echo "## 🛡️ Weekly Security Report"
            echo ""
            echo "**Date**: $(date +%Y-%m-%d)"
            echo "**Workflow run**: [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "**Python scanners**: ${{ steps.totals.outputs.py_scanner }} (pip-audit: ${{ steps.totals.outputs.py_pip_audit }}, Safety: ${{ steps.totals.outputs.py_safety }})"
            echo ""
            echo "### 📊 Summary"
            echo ""
            echo "| Stack | Vulnerabilities | Outdated |"
            echo "|---|---:|---:|"
            echo "| Python | ${{ steps.totals.outputs.py_vulns }} | ${{ steps.totals.outputs.py_outdated }} |"
            echo "| Node (prod-vulns / all-outdated) | ${{ steps.totals.outputs.node_vulns }} | ${{ steps.totals.outputs.node_outdated }} |"
            echo "| **Total** | **${{ steps.totals.outputs.vulns }}** | **${{ steps.totals.outputs.outdated }}** |"
            echo ""
            if [ "${{ steps.totals.outputs.vulns }}" != "0" ]; then
              echo "### 🚨 Vulnerabilities"
              echo ""
              # Compact tables, not raw scanner JSON: advisory descriptions
              # run to kilobytes each, and an issue body is capped at 65,536
              # characters. The advisory ID links out to the full text.
              for f in .audit/pipaudit_*.json; do
                [ -f "$f" ] || continue
                rows=$(jq -r '(.dependencies // [])[]? | . as $d | (.vulns // [])[]? |
                  "| \($d.name) | \($d.version) | [\(.id)](https://osv.dev/vulnerability/\(.id)) | \((.aliases // []) | join(", ")) | \((.fix_versions // []) | join(", ")) |"' "$f" 2>/dev/null || true)
                [ -n "$rows" ] || continue
                label=$(cat "${f%.json}.label" 2>/dev/null || basename "$f" .json)
                echo "**Python (pip-audit): $label**"
                echo ""
                echo "| Package | Version | Advisory | Aliases | Fixed in |"
                echo "|---|---|---|---|---|"
                echo "$rows"
                echo ""
              done
              if compgen -G ".audit/safety_*.json" > /dev/null; then
                rows=$(jq -r '(.scan_results.projects // [])[]?.files[]?.results.dependencies[]? |
                  select((.vulnerabilities // []) | length > 0) |
                  "| \(.name) | \([.vulnerabilities[]? | (.id // .vulnerability_id // .cve // "?") | tostring] | unique | join(", ")) |"' .audit/safety_*.json 2>/dev/null | sort -u || true)
                if [ -n "$rows" ]; then
                  echo "**Python (Safety)**"
                  echo ""
                  echo "| Package | Advisories |"
                  echo "|---|---|"
                  echo "$rows"
                  echo ""
                fi
              fi
              rows=$(jq -r '(.vulnerabilities // {}) | to_entries[] | select(.value.severity != "info") |
                "| \(.key) | \(.value.severity) | \(.value.range // "—") | \(if (.value.fixAvailable // false) then "yes" else "no" end) |"' .audit/node_audit_*.json 2>/dev/null || true)
              if [ -n "$rows" ]; then
                echo "**Node (npm audit, prod-only)**"
                echo ""
                echo "| Package | Severity | Range | Fix available |"
                echo "|---|---|---|---|"
                echo "$rows"
                echo ""
              fi
            fi
            if [ "${{ steps.totals.outputs.outdated }}" != "0" ]; then
              echo "### 📦 Outdated dependencies"
              echo ""
              for f in .audit/py_outdated_*.json; do
                [ -f "$f" ] || continue
                [ "$(jq 'length' "$f" 2>/dev/null)" = "0" ] && continue
                label=$(cat "${f%.json}.label" 2>/dev/null || basename "$f" .json)
                echo "**Python — $label**"
                echo ""
                echo "| Package | Current | Latest | Type |"
                echo "|---|---|---|---|"
                jq -r '.[] | "| \(.name) | \(.version) | \(.latest_version // .latest) | \(.latest_filetype // "wheel") |"' "$f" 2>/dev/null
                echo ""
              done
              for f in .audit/node_outdated_*.json; do
                [ -f "$f" ] || continue
                content=$(cat "$f")
                [ -z "$content" ] || [ "$content" = "{}" ] && continue
                label=$(basename "$f" .json | sed 's/node_outdated_//' | tr '_' '/')
                echo "**Node — $label**"
                echo ""
                echo "| Package | Current | Wanted | Latest |"
                echo "|---|---|---|---|"
                echo "$content" | jq -r 'to_entries[] | "| \(.key) | \(.value.current // "—") | \(.value.wanted // "—") | \(.value.latest // "—") |"' 2>/dev/null
                echo ""
              done
            fi
            echo "### 🛠️ Suggested fixes"
            echo ""
            echo "- **Python**: \`safety scan --apply-updates\` (or \`pip-audit --fix\`); for pinned files bump the version and re-run."
            echo "- **Node**: \`npm audit fix\` for non-breaking; \`npm update\` for outdated; \`npx npm-check-updates -u\` for major bumps."
            echo "- Review breaking changes carefully — outdated ≠ broken."
            echo ""
            echo "---"
            echo "_Automated by \`.github/workflows/weekly-security-report.yml\`. Next run: Monday 09:00 UTC._"
          } > .audit/report.md
          echo "Report body: $(wc -c < .audit/report.md) bytes"

      - name: Find existing open report
        id: find
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,automated',
              per_page: 50,
            });
            const existing = data.find(i => i.title.startsWith('🛡️ Weekly Security Report'));
            core.setOutput('existing_number', existing ? existing.number : '');

      - name: Create or update issue (findings present)
        id: upsert
        if: steps.totals.outputs.vulns != '0' || steps.totals.outputs.outdated != '0'
        uses: actions/github-script@v9
        env:
          EXISTING: ${{ steps.find.outputs.existing_number }}
        with:
          script: |
            const title = `🛡️ Weekly Security Report - ${new Date().toISOString().slice(0,10)}`;
            // GitHub rejects issue bodies over 65,536 characters; leave room
            // for the truncation note rather than failing the whole report.
            const fs = require('fs');
            const LIMIT = 65000;
            let body = fs.readFileSync('.audit/report.md', 'utf8');
            if (body.length > LIMIT) {
              body = body.slice(0, LIMIT) +
                `\n\n…_Truncated. Full output in the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})._`;
            }
            const labels = ['security', 'automated', 'maintenance'];
            const assignees = ['MaBoNi'];
            // Org-wide issue type, set through the REST `type` field rather
            // than the GraphQL updateIssueIssueType mutation the org copy
            // used: that needs an organization-level read of issueTypes,
            // which the repo-scoped GITHUB_TOKEN doesn't have ("Resource not
            // accessible by integration"). REST resolves the type by name
            // inside the repo, so issues: write is enough. Passed on update
            // too so an issue created before this change gets typed.
            const type = 'Task';

            if (process.env.EXISTING) {
              const num = parseInt(process.env.EXISTING, 10);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: num,
                title, body, type,
              });
              core.notice(`Updated existing report #${num}`);
              core.setOutput('current_report', String(num));
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title, body, labels, assignees, type,
              });
              core.notice(`Created report #${created.data.number}`);
              core.setOutput('current_report', String(created.data.number));
            }

      - name: Close stale clean-week report
        if: steps.totals.outputs.vulns == '0' && steps.totals.outputs.outdated == '0' && steps.find.outputs.existing_number != ''
        uses: actions/github-script@v9
        env:
          EXISTING: ${{ steps.find.outputs.existing_number }}
        with:
          script: |
            const num = parseInt(process.env.EXISTING, 10);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: num,
              body: `✅ This week's scan is clean (0 vulnerabilities, 0 outdated). Auto-closing — next run on Monday 09:00 UTC.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: num,
              state: 'closed',
              state_reason: 'completed',
            });
            core.notice(`Auto-closed clean-week report #${num}`);

      # Keep only the current week's report open; close any older/duplicate
      # automated weekly reports (including legacy `weekly-report` issues) so
      # they don't pile up in the backlog.
      - name: Close superseded weekly reports
        if: success()
        uses: actions/github-script@v9
        env:
          CURRENT: ${{ steps.upsert.outputs.current_report }}
        with:
          script: |
            const current = process.env.CURRENT ? parseInt(process.env.CURRENT, 10) : null;
            // Collect open automated weekly-report issues across the current
            // label set and the legacy `weekly-report` label.
            const byNumber = new Map();
            for (const labels of ['security,automated', 'weekly-report']) {
              const items = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels,
                per_page: 100,
              });
              for (const it of items) byNumber.set(it.number, it);
            }
            const isReport = (i) => {
              const t = i.title || '';
              const names = (i.labels || []).map(l => (typeof l === 'string' ? l : l.name));
              return t.startsWith('🛡️ Weekly Security Report')
                || t.startsWith('🧱 Weekly LEGO Maintenance Report')
                || names.includes('weekly-report');
            };
            for (const [num, issue] of byNumber) {
              if (current !== null && num === current) continue;
              if (issue.pull_request) continue;
              if (!isReport(issue)) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: num,
                body: '🧹 Superseded by the latest weekly report — auto-closing to keep the backlog tidy.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: num,
                state: 'closed',
                state_reason: 'completed',
              });
              core.notice(`Closed superseded weekly report #${num}`);
            }

      - name: All clear
        if: steps.totals.outputs.vulns == '0' && steps.totals.outputs.outdated == '0'
        run: |
          echo "✅ No vulnerabilities and no outdated dependencies."
